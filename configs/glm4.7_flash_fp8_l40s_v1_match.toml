# GLM-4.7-Flash FP8 Dynamic on a single L40S (48GB)
#
# Purpose:
#   Reproduce configs/glm4_flash.toml as closely as possible while staying on
#   the GLM-4.7 FP8 + vLLM lane required for cheap proxy work.
#
# Deliberate matches to glm4_flash.toml:
#   - vector_method = "mean"
#   - decay_kernel = "linear"
#   - orthogonal_projection = true
#   - weight_normalization = "none"
#   - strength_range = [1.0, 10.0]
#   - no discriminative layer selection
#   - 50 trials / 15 warmup
#   - good_500 / harmful_500 train[:400] and train[400:]
#
# Deliberate differences:
#   - model is unsloth FP8 and backend is vLLM
#   - judge uses OpenRouter DeepSeek with explicit reasoning budget
#   - vLLM legacy fused-expert ablation may be skipped by the backend, but the
#     default [experts] search surface is restored instead of clamped to zero.

non_interactive = true

[model]
model_id = "unsloth/GLM-4.7-Flash-FP8-Dynamic"
backend = "vllm"
dtype_fallback_order = ["bfloat16"]
quant_method = "none"
trust_remote_code = true
use_torch_compile = false
tensor_parallel_size = 1
gpu_memory_utilization = 0.88
enable_expert_parallel = false
enforce_eager = true
disable_lora = false
use_in_place_editing = false
vllm_return_routed_experts = true
moe_backend = "triton"
max_model_len = 2048
max_num_seqs = 16
vllm_max_lora_rank = 1

[inference]
batch_size = 0
max_batch_size = 8
max_gen_tokens = 150

[steering]
steering_mode = "lora"
vector_method = "mean"
n_directions = 1
orthogonal_projection = true
discriminative_layer_selection = false
decay_kernel = "linear"
weight_normalization = "none"
strength_range = [1.0, 10.0]

[optimization]
num_trials = 50
num_warmup_trials = 15
checkpoint_dir = "checkpoints_glm47_flash_fp8_l40s_v1_match"

[kl]
scale = 1.0
token_count = 3
target = 0.01
prune_threshold = 0.1

[experts]
max_suppress = 30
router_bias_range = [-10.0, 0.0]
ablation_weight_range = [0.0, 5.0]

[detection]
llm_judge = true
llm_judge_model = "deepseek/deepseek-v4-flash"
llm_judge_reasoning_budget = 2048
llm_judge_batch_size = 5
llm_judge_concurrency = 10

[display]
print_responses = false
print_residual_geometry = false
plot_residuals = false

[benign_prompts]
dataset = "datasets/good_500"
split = "train[:400]"
column = "prompt"

[target_prompts]
dataset = "datasets/harmful_500"
split = "train[:400]"
column = "prompt"

[benign_eval_prompts]
dataset = "datasets/good_500"
split = "train[400:]"
column = "prompt"

[target_eval_prompts]
dataset = "datasets/harmful_500"
split = "train[400:]"
column = "prompt"
